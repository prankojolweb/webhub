<!-- ==================================================
     VIDEO + INTERSTITIAL CONTROL
     ================================================== -->

<script>

const v = document.getElementById('video');
const meta = document.getElementById('meta');

const playOverlay = document.getElementById('playOverlay');
const playButton = document.getElementById('playButton');

const interstitialLayer =
document.getElementById('interstitial-layer');

const closeAd =
document.getElementById('close-ad');

let adOpened = false;
let videoStarted = false;


/*
==================================================
KLIK PLAY
==================================================
*/

playButton.addEventListener('click', function(e){

e.preventDefault();
e.stopPropagation();

if(videoStarted) return;

adOpened = true;

interstitialLayer.style.display = 'flex';

});


/*
==================================================
SETELAH IKLAN DITUTUP
VIDEO MULAI
==================================================
*/

closeAd.addEventListener('click', function(){

interstitialLayer.style.display = 'none';

videoStarted = true;

playOverlay.classList.add('hidden');

v.play().catch(function(){

playOverlay.classList.remove('hidden');

});

});


/*
==================================================
FALLBACK:
JIKA PROVIDER TIDAK MEMBERIKAN TOMBOL CLOSE,
TOMBOL CLOSE MUNCUL SETELAH BEBERAPA DETIK.
==================================================
*/

setTimeout(function(){

if(adOpened){

closeAd.style.display = 'block';

}

},5000);


/*
==================================================
JIKA VIDEO DIPUTAR DARI CONTROL BAWAAN
TETAP TAHAN SEBELUM PLAY PERTAMA
==================================================
*/

v.addEventListener('play', function(){

if(!videoStarted){

v.pause();

interstitialLayer.style.display = 'flex';

}

});


/*
==================================================
FORMAT WAKTU
==================================================
*/

function fmt(t){

const m = Math.floor(t/60);

const s =
Math.floor(t%60)
.toString()
.padStart(2,'0');

return `${m}:${s}`;

}


/*
==================================================
UPDATE DURASI
==================================================
*/

v.addEventListener('loadedmetadata', function(){

meta.textContent =
`0:00 / ${fmt(v.duration)}`;

});


/*
==================================================
UPDATE PROGRESS
==================================================
*/

v.addEventListener('timeupdate', function(){

meta.textContent =
`${fmt(v.currentTime)} / ${fmt(v.duration)}`;

});

</script>
