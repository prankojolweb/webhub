<!-- ==============================
     INTERSTITIAL DIPICU SAAT VIDEO
     DIMULAI
     ============================== -->

<script>
const v = document.getElementById('video');
const meta = document.querySelector('.meta');

let interstitialShown = false;

v.addEventListener('play', function(){

  if(interstitialShown) return;

  interstitialShown = true;

  /*
   * Memberi kesempatan widget 6031412
   * untuk diproses sebelum video berjalan.
   */
  setTimeout(function(){
    if(v.paused){
      v.play().catch(()=>{});
    }
  }, 500);

});


function fmt(t){
  const m = Math.floor(t/60);
  const s = Math.floor(t%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

v.addEventListener('loadedmetadata', ()=>{
  meta.textContent = `0:00 / ${fmt(v.duration)}`;
});

v.addEventListener('timeupdate', ()=>{
  meta.textContent = `${fmt(v.currentTime)} / ${fmt(v.duration)}`;
});
</script>
