<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Full HD Video</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    Roboto,Helvetica,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#fff;
}

/* LANDING */
#landing{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
}

.card{
    width:100%;
    max-width:480px;
    background:#fff;
    border:1px solid #eee;
    border-radius:30px;
    padding:38px 28px 30px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.07);
}

.play-icon{
    display:inline-block;
    margin-bottom:15px;
    cursor:pointer;
}

.play-icon i{
    font-size:72px;
    color:#1e293b;
}

h1{
    font-size:30px;
    color:#0b0d10;
    margin-bottom:20px;
}

.quality{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    padding:11px 18px;
    margin-bottom:18px;
    background:#f5f7fa;
    border:1px solid #e8ecf0;
    border-radius:40px;
    color:#1e293b;
    font-size:14px;
}

.quality i:first-child{
    color:#2563eb;
}

.quality .check{
    color:#16a34a;
}

.quality strong{
    background:#e8ecf0;
    padding:2px 8px;
    border-radius:20px;
}

.desc{
    color:#475569;
    font-size:15px;
    line-height:1.6;
    margin-bottom:25px;
}

.btn-primary{
    width:100%;
    border:0;
    border-radius:60px;
    padding:16px 20px;
    background:#1e293b;
    color:#fff;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
}

.btn-primary:active{
    transform:scale(.97);
}

.footer{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:25px;
    padding-top:17px;
    border-top:1px solid #eceff3;
}

.footer span{
    color:#334155;
    font-size:13px;
}

.footer i{
    color:#2563eb;
    margin-right:5px;
}

/* PLAYER */
#playerPage{
    display:none;
    width:100%;
    min-height:100vh;
    background:#0b0d10;
}

.player{
    width:100%;
    background:#0b0d10;
    padding:12px 0 20px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:0 16px 12px;
    border-bottom:1px solid #1e293b;
}

.brand{
    color:#94a3b8;
    font-size:13px;
    font-weight:600;
    letter-spacing:1px;
}

.badge{
    background:#f59e0b;
    color:#0b0d10;
    font-size:10px;
    font-weight:700;
    padding:4px 12px;
    border-radius:30px;
}

.counter{
    color:#94a3b8;
    font-size:10px;
    background:#1e293b;
    padding:4px 10px;
    border-radius:30px;
}

.video-container{
    position:relative;
    width:100%;
    padding-bottom:177.78%;
    height:0;
    overflow:hidden;
    background:#0a0e14;
}

video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#0a0e14;
}

.overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.3);
    cursor:pointer;
}

.overlay.hidden{
    opacity:0;
    pointer-events:none;
}

.overlay i{
    font-size:70px;
    color:rgba(255,255,255,.88);
}

.play-text{
    position:absolute;
    bottom:20%;
    color:rgba(255,255,255,.65);
    font-size:13px;
}

.controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    padding:9px 14px 11px;
    background:#0b0d10;
    border-top:1px solid #1e293b;
}

.controls button{
    background:none;
    border:0;
    color:#e2e8f0;
    cursor:pointer;
    padding:5px;
}

.progress-container{
    flex:1;
    min-width:100px;
    display:flex;
    align-items:center;
    gap:8px;
}

.progress{
    flex:1;
    height:4px;
    background:#1e293b;
    border-radius:10px;
    cursor:pointer;
}

.fill{
    width:0;
    height:100%;
    background:#2563eb;
    border-radius:10px;
}

.time{
    color:#cbd5e1;
    font-size:11px;
    min-width:78px;
    text-align:center;
}

.volume{
    display:flex;
    align-items:center;
}

.volume input{
    width:45px;
}

.next{
    background:#1e293b!important;
    border:1px solid #334155!important;
    border-radius:30px;
    padding:5px 12px!important;
    font-size:11px;
}

.info{
    margin:12px 14px;
    padding:16px;
    background:#131a24;
    border:1px solid #1e293b;
    border-radius:15px;
}

.info-title{
    color:#94a3b8;
    font-size:12px;
    font-weight:600;
    margin-bottom:6px;
}

.info-text{
    color:#e2e8f0;
    font-size:14px;
    line-height:1.5;
}

.footer-player{
    text-align:center;
    color:#475569;
    font-size:10px;
    padding:13px 14px 0;
    border-top:1px solid #1e293b;
    margin:10px 14px 0;
}

.back{
    display:block;
    margin:auto;
    padding:13px;
    background:none;
    border:0;
    color:#64748b;
    cursor:pointer;
}

@media(max-width:480px){

    .card{
        padding:25px 16px;
        border-radius:24px;
    }

    h1{
        font-size:25px;
    }

    .play-icon i{
        font-size:55px;
    }

    .btn-primary{
        font-size:16px;
    }

    .overlay i{
        font-size:50px;
    }
}
</style>
</head>

<body>

<!-- LANDING PAGE -->
<section id="landing">

    <div class="card">

        <div class="play-icon" id="playIcon">
            <i class="fas fa-play-circle"></i>
        </div>

        <h1>Watch Full HD Video</h1>

        <div class="quality">
            <i class="fas fa-hdd"></i>

            <span>
                High-definition
                <strong>1080p</strong>
                Quality detected.
            </span>

            <i class="fas fa-check-circle check"></i>
        </div>

        <div class="desc">
            Click the button below to start streaming.
        </div>

        <button class="btn-primary" id="continueBtn">
            Continue Watching
            <i class="fas fa-arrow-right"></i>
        </button>

        <div class="footer">

            <span>
                <i class="fas fa-shield-alt"></i>
                Secure
            </span>

            <span>
                <i class="fas fa-bolt"></i>
                Fast Streaming
            </span>

        </div>

    </div>

</section>


<!-- PLAYER PAGE -->
<section id="playerPage">

    <div class="player">

        <div class="header">

            <span class="brand">
                VIDEOPLAYER
            </span>

            <span class="badge">
                FULL HD
            </span>

            <span class="counter" id="counter">
                1 / 6
            </span>

        </div>


        <div class="video-container">

            <video
                id="video"
                playsinline
                preload="metadata">

                <source id="source" src="" type="video/mp4">

                Browser kamu tidak mendukung video.
            </video>


            <div class="overlay" id="overlay">

                <i class="fas fa-play-circle"></i>

                <span class="play-text">
                    ▶ Click to Play
                </span>

            </div>

        </div>


        <div class="controls">

            <button id="playPause" title="Play/Pause">
                <i class="fas fa-play"></i>
            </button>

            <div class="progress-container">

                <div class="progress" id="progress">

                    <div class="fill" id="fill"></div>

                </div>

                <span class="time" id="time">
                    00:00 / 00:00
                </span>

            </div>

            <div class="volume">

                <button id="mute">
                    <i class="fas fa-volume-up"></i>
                </button>

                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    value="0.8">

            </div>

            <button class="next" id="next">
                <i class="fas fa-forward"></i>
                Next
            </button>

        </div>


        <div class="info">

            <div class="info-title">
                PLAYBACK
            </div>

            <div class="info-text">
                Video siap diputar. Gunakan kontrol player
                untuk Play, Pause, Volume, dan Next Video.
            </div>

        </div>


        <div class="footer-player">
            Video Player
        </div>


        <button class="back" id="back">
            ← Back to home
        </button>

    </div>

</section>


<script>

"use strict";


/* ================= VIDEO ================= */

const VIDEOS = [

    {
        title:"Big Buck Bunny",
        src:"https://cdn.aceimg.com/lOUff4isJ.mp4"
    },

    {
        title:"Sample Movie",
        src:"https://cdn2.aceimg.com/ftcqxZz83.mp4"
    },

    {
        title:"Big Buck Bunny HD",
        src:"https://cdn.aceimg.com/7Ax5Eq9F6.mp4"
    },

    {
        title:"Elephants Dream",
        src:"https://cdn2.aceimg.com/5d46c17c8.mp4"
    },

    {
        title:"Video 5",
        src:"https://cdn2.aceimg.com/AMI8zc8Bi.mp4"
    },

    {
        title:"For Bigger Blazes",
        src:"https://cdn2.aceimg.com/30AtFg57J.mp4"
    }

];


/* ================= ELEMENT ================= */

const landing =
document.getElementById("landing");

const playerPage =
document.getElementById("playerPage");

const continueBtn =
document.getElementById("continueBtn");

const playIcon =
document.getElementById("playIcon");

const back =
document.getElementById("back");

const video =
document.getElementById("video");

const source =
document.getElementById("source");

const overlay =
document.getElementById("overlay");

const playPause =
document.getElementById("playPause");

const progress =
document.getElementById("progress");

const fill =
document.getElementById("fill");

const time =
document.getElementById("time");

const mute =
document.getElementById("mute");

const volume =
document.getElementById("volume");

const next =
document.getElementById("next");

const counter =
document.getElementById("counter");


let current = 0;


/* ================= LOAD ================= */

function loadVideo(index){

    if(!VIDEOS[index]) return;

    current = index;

    source.src = VIDEOS[index].src;

    video.load();

    counter.textContent =
        (index + 1) +
        " / " +
        VIDEOS.length;

    fill.style.width = "0%";

    time.textContent =
        "00:00 / 00:00";

    overlay.classList.remove("hidden");

    playPause.innerHTML =
        '<i class="fas fa-play"></i>';
}


/* ================= PLAYER ================= */

function showPlayer(){

    landing.style.display = "none";

    playerPage.style.display = "block";

    document.body.style.background =
        "#0b0d10";

    loadVideo(0);

    window.scrollTo(0,0);
}


function showLanding(){

    video.pause();

    playerPage.style.display = "none";

    landing.style.display = "flex";

    document.body.style.background =
        "#fff";
}


/* ================= BUTTON ================= */

continueBtn.addEventListener(
    "click",
    showPlayer
);

playIcon.addEventListener(
    "click",
    showPlayer
);

back.addEventListener(
    "click",
    showLanding
);


/* ================= PLAY ================= */

function playVideo(){

    video.play().catch(function(){});

    overlay.classList.add("hidden");

    playPause.innerHTML =
        '<i class="fas fa-pause"></i>';
}


function pauseVideo(){

    video.pause();

    overlay.classList.remove("hidden");

    playPause.innerHTML =
        '<i class="fas fa-play"></i>';
}


function togglePlay(){

    if(video.paused){

        playVideo();

    }else{

        pauseVideo();

    }
}


playPause.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

        togglePlay();
    }
);


video.addEventListener(
    "click",
    togglePlay
);


overlay.addEventListener(
    "click",
    playVideo
);


/* ================= NEXT ================= */

next.addEventListener(
    "click",
    function(){

        current++;

        if(current >= VIDEOS.length){
            current = 0;
        }

        loadVideo(current);
    }
);


video.addEventListener(
    "ended",
    function(){

        current++;

        if(current >= VIDEOS.length){
            current = 0;
        }

        loadVideo(current);
    }
);


/* ================= PROGRESS ================= */

video.addEventListener(
    "timeupdate",
    function(){

        if(
            video.duration &&
            isFinite(video.duration)
        ){

            fill.style.width =
                (
                    video.currentTime /
                    video.duration *
                    100
                ) + "%";
        }

        updateTime();
    }
);


function updateTime(){

    time.textContent =
        formatTime(video.currentTime) +
        " / " +
        formatTime(video.duration);
}


function formatTime(seconds){

    if(
        isNaN(seconds) ||
        !isFinite(seconds)
    ){

        return "00:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secondsPart =
        Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(secondsPart).padStart(2,"0")
    );
}


progress.addEventListener(
    "click",
    function(e){

        if(
            !video.duration ||
            !isFinite(video.duration)
        ) return;

        const rect =
            progress.getBoundingClientRect();

        let percent =
            (e.clientX - rect.left) /
            rect.width;

        percent =
            Math.max(
                0,
                Math.min(1,percent)
            );

        video.currentTime =
            percent * video.duration;
    }
);


/* ================= VOLUME ================= */

volume.addEventListener(
    "input",
    function(){

        video.volume =
            Number(this.value);

        updateMuteIcon();
    }
);


mute.addEventListener(
    "click",
    function(){

        video.muted =
            !video.muted;

        updateMuteIcon();
    }
);


function updateMuteIcon(){

    if(
        video.muted ||
        video.volume === 0
    ){

        mute.innerHTML =
            '<i class="fas fa-volume-mute"></i>';

    }else if(
        video.volume < 0.5
    ){

        mute.innerHTML =
            '<i class="fas fa-volume-down"></i>';

    }else{

        mute.innerHTML =
            '<i class="fas fa-volume-up"></i>';
    }
}


/* ================= INITIAL ================= */

video.volume = 0.8;

volume.value = 0.8;

showLanding();

</script>

</body>
</html>
